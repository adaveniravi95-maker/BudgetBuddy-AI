databases:
  - name: budgetbuddy-db
    databaseName: budgetbuddy
    user: budgetbuddy
    plan: 0.1c-256mb
    ipAllowList: []

services:
  - type: web
    name: budgetbuddy-api
    runtime: python
    plan: 0.5c-512mb
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input
    preDeployCommand: python manage.py migrate --noinput
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health/
    envVars:
      - key: DJANGO_DEBUG
        value: 'false'
      - key: SECURE_SSL_REDIRECT
        value: 'true'
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SIGNING_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: budgetbuddy-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: budgetbuddy-api.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://budgetbuddy-frontend.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://budgetbuddy-frontend.onrender.com

  - type: web
    name: budgetbuddy-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://budgetbuddy-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: DENY